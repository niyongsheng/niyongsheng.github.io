name: Deploy Blog

on:
  push:
    branches: [master]
    paths:
      - 'source/**'
      - 'scaffolds/**'
      - 'themes/**'
      - '_config*.yml'
      - 'package*.json'
      - '.github/workflows/blog-deploy.yml'
  workflow_dispatch:

# actions-gh-pages 需要向 gh-pages 分支推送
permissions:
  contents: write

# 连续推送时只保留最后一次构建
concurrency:
  group: blog-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: |
          npx hexo clean
          npx hexo generate

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true